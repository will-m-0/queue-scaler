# This rule is not used by the project queue-scaler itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to scaling.will-m-0.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: queue-scaler
    app.kubernetes.io/managed-by: kustomize
  name: mmcscaler-viewer-role
rules:
- apiGroups:
  - scaling.will-m-0.github.io
  resources:
  - mmcscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scaling.will-m-0.github.io
  resources:
  - mmcscalers/status
  verbs:
  - get
