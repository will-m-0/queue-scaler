# This rule is not used by the project queue-scaler itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the scaling.will-m-0.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: queue-scaler
    app.kubernetes.io/managed-by: kustomize
  name: mmcscaler-editor-role
rules:
- apiGroups:
  - scaling.will-m-0.github.io
  resources:
  - mmcscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scaling.will-m-0.github.io
  resources:
  - mmcscalers/status
  verbs:
  - get
